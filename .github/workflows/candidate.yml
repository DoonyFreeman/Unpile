name: Build candidate (no publication)
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  candidate:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - run: swift run -c release UnpileChecks
      - run: bash scripts/package-dmg.sh --universal
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: Unpile-local-candidate
          path: build/releases/Unpile-*-universal.*
          if-no-files-found: error
          retention-days: 14
